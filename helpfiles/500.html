<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Error - Nex</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --text-color: #c9d1d9;
            --accent-color: #f78166;
            /* Reddish for error */
            --card-bg: #161b22;
            --border-color: #30363d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            text-align: center;
            background-color: var(--card-bg);
            padding: 60px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            max-width: 500px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 120px;
            margin: 0;
            line-height: 1;
            font-weight: 800;
            background: -webkit-linear-gradient(45deg, #f78166, #da3633);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h2 {
            margin-top: 10px;
            font-size: 24px;
            color: #fff;
        }

        p {
            margin: 20px 0 40px;
            font-size: 16px;
            color: #8b949e;
            line-height: 1.5;
        }

        .btn {
            display: inline-block;
            background-color: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 12px 28px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn:hover {
            background-color: #30363d;
            border-color: #8b949e;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>500</h1>
        <h2>Internal Server Error</h2>
        <p>Something went wrong on our end. Please try again later or contact support if the issue persists.</p>
        <a href="/" class="btn">Try Again</a>
    </div>
</body>

</html>
